<!DOCTYPE html>
<html>
	<head>
		<!-- HTML boilerplate -->
		<meta charset="utf8"/>
		<title>Host (WebRTC via QR example)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
		<link rel="icon" href="/favicon.ico"/>
		<link rel="stylesheet" href="./style.css"/>
		<!-- Example script -->
		<script type="module">
			import { HostConnection } from "../"	// from "webrtc-via-qr"
			import QRCode from "qrcode"
			import jsQR from "jsqr"

			let h = new HostConnection()

			// Buttons
			inviteButton.addEventListener("click", () => {
				h.createInvite()
					.then(invite => {
						inviteDialog.showModal()
						QRCode.toCanvas(qr, "http://192.168.0.154:5173/example/join.html?invite=" + invite)
					})
			})

			acceptButton.addEventListener("click", () => {
				acceptDialog.showModal()
				startScanning()
			})

			closeInviteButton.addEventListener("click", () => {
				inviteDialog.close()
			})
			
			closeAcceptButton.addEventListener("click", () => {
				stopScanning()
				acceptDialog.close()
			})

			// Shortcut
			function appendMessage(msg) {
				let p = document.createElement("p")
				p.textContent = msg
				messages.appendChild(p)
			}
			
			// Scanning
			let streamRefForClosing, running	// Running is only required in Firefox when requestAnimationFrame() is used
			function startScanning() {
				running = true
				const video = document.createElement("video")
				const ctx = scan.getContext("2d")
				ctx.willReadFrequently = true	// Use GPU memory

				window.navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", frameRate:{ideal: 10}}})	// Limited FPS for now
					.then(stream => {
						streamRefForClosing = stream
						video.srcObject = stream
						video.play()
						video.requestVideoFrameCallback(tick)	// Not working in Firefox!
						// requestAnimationFrame(tick)
					})
				
				function tick() {
					if (video.readyState === video.HAVE_ENOUGH_DATA) {
						ctx.drawImage(video, 0, 0, scan.width, scan.height)
						// Actual scanning
						const pixels = ctx.getImageData(0, 0, scan.width, scan.height)
						const code = jsQR(pixels.data, pixels.width, pixels.height, {inversionAttempts: "dontInvert"})
						if (code) {
							h.confirmAccept(code.data)
							stopScanning()

							// Same as join.html (Todo: DRY)
							// Connection successful
							h.on("connect", () => {
								acceptDialog.close()
								chat.setAttribute("placeholder", "Enter message")
								chat.removeAttribute("disabled")
								appendMessage(`Connected successfuly @ ${Date.now()}`)
							})
							// Show incoming messages
							h.on("message", (msg) => {
								msg = JSON.parse(msg)
								appendMessage(`${msg.user}: ${msg.text}`)
							})
							// Add ability to send messages
							send.addEventListener("click", () => {
								appendMessage(`Me: ${chat.value}`)
								h.sendChannel.send(JSON.stringify({
									user: "Host",
									text: chat.value
								}))
								chat.value = ""
							})
						}
					}
					if (running) {
						video.requestVideoFrameCallback(tick)	// Not working in Firefox!
						// requestAnimationFrame(tick)
					}
				}
			}

			function stopScanning() {
				if (running) {
					streamRefForClosing.getTracks().forEach(track => track.stop())
					running = false
				}
			}
		</script>
	</head>
	<body>
		<dialog id="inviteDialog">
			<h2>Scanned by joinee</h2>
			<canvas id="qr" style="max-width:300px;max-height:300px"></canvas>
			<button id="closeInviteButton">Close</button>
		</dialog>
		<dialog id="acceptDialog">
			<h2>Scan accept code</h2>
			<canvas id="scan" width="640" height="360"></canvas>
			<button id="closeAcceptButton">Stop scanning</button>
		</dialog>
		<h1>Host</h1>
		<div>
			<button id="inviteButton">Create invite</button>
			<button id="acceptButton">Accept confirm</button>
		</div>
		<div>
			<input type="text" id="chat" placeholder="Not connected" disabled/>
			<button id="send">Send</button>
		</div>
		<div id="messages">
			<p>Connecting...</p>
		</div>
	</body>
</html>
