<!DOCTYPE html>
<html>
	<head>
		<!-- HTML boilerplate -->
		<meta charset="utf8"/>
		<title>Host (WebRTC via QR example)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
		<link rel="icon" href="/favicon.ico"/>
		<link rel="stylesheet" href="./style.css"/>
		<!-- Example script -->
		<script type="module">
			import { HostConnection } from "../"	// from "webrtc-via-qr"
			import QRCode from "qrcode"
			import jsQR from "jsqr"

			// Config
			const CAMERA_CONSTRAINTS = {
				video: {
					facingMode: "environment",
					frameRate: {
						ideal: 10	// Limited FPS for now
					}
				}
			}

			// Helper shortcuts
			function isFirefox() {
				return navigator.userAgent.includes("Firefox")
			}

			function appendMessage(msg) {
				let p = document.createElement("p")
				p.textContent = msg
				messages.appendChild(p)
			}

			// Create connection
			let h = new HostConnection()
			let sendChannel = h.createDataChannel("fromhost")
			let receiveChannel

			// Setup listeners
			h.addEventListener("datachannel", e => {
				// Todo: DRY - same as join.html
				// Connection successful: Channel established
				receiveChannel = e.channel
				receiveChannel.addEventListener("message", e => {
					let msg = JSON.parse(e.data)
					appendMessage(`${msg.user}: ${msg.text}`)
				})
				// Enable Messaging
				acceptDialog.close()
				chat.setAttribute("placeholder", "Enter message")
				chat.removeAttribute("disabled")
				appendMessage(`Connected successfuly @ ${Date.now()}`)
				// Add ability to send messages
				send.addEventListener("click", () => {
					appendMessage(`Me: ${chat.value}`)
					sendChannel.send(JSON.stringify({
						user: "Host",
						text: chat.value
					}))
					chat.value = ""
				})
			})

			// Buttons
			inviteButton.addEventListener("click", () => {
				h.createInvite()
					.then(invite => {
						inviteDialog.showModal()
						QRCode.toCanvas(qr, "http://192.168.0.154:5173/example/join.html?invite=" + invite)
					})
			})

			acceptButton.addEventListener("click", () => {
				acceptDialog.showModal()
				startScanning()
			})

			closeInviteButton.addEventListener("click", () => {
				inviteDialog.close()
			})
			
			closeAcceptButton.addEventListener("click", () => {
				stopScanning()
				acceptDialog.close()
			})
			
			// Scanning
			function stopScanning() {}	// Doesn't need to do anything if not scanning yet

			function startScanning() {
				const video = document.createElement("video")
				const ctx = scan.getContext("2d", {
					willReadFrequently: true
				})
				
				function tick() {
					// Only scan if new video frame available
					if (video.readyState == video.HAVE_ENOUGH_DATA) {
						// Draw frame to canvas
						ctx.drawImage(video, 0, 0, scan.width, scan.height)
						// Scan frame for QR
						const pixels = ctx.getImageData(0, 0, scan.width, scan.height)
						const code = jsQR(pixels.data, pixels.width, pixels.height, {inversionAttempts: "dontInvert"})
						if (code) {
							h.confirmAccept(code.data)
							stopScanning()
						}
					}
					// Keep looping
					if (!video.paused) {
						video.requestVideoFrameCallback(tick)
					}
				}

				// Setup camera stream
				window.navigator.mediaDevices.getUserMedia(CAMERA_CONSTRAINTS)
					.then(stream => {
						video.srcObject = stream
						video.play()
						// Implement stopping
						stopScanning = function() {
							video.pause()
							stream.getTracks().forEach(track => track.stop())
						}
						// Start scan-loop
						// HACK: requestVideoFrameCallback isn't implemented in Firefox
						if (isFirefox()) {
							video.requestVideoFrameCallback = function(tick) {
								window.requestAnimationFrame(tick)
							}
						}
						// HACK END
						video.requestVideoFrameCallback(tick)
					})
			}
		</script>
	</head>
	<body>
		<dialog id="inviteDialog">
			<h2>Scanned by joinee</h2>
			<canvas id="qr"></canvas>
			<button id="closeInviteButton">Close</button>
		</dialog>
		<dialog id="acceptDialog">
			<h2>Scan accept code</h2>
			<canvas id="scan" width="640" height="360"></canvas>
			<button id="closeAcceptButton">Stop scanning</button>
		</dialog>
		<h1>Host</h1>
		<div>
			<button id="inviteButton">Create invite</button>
			<button id="acceptButton">Accept confirm</button>
		</div>
		<div>
			<input type="text" id="chat" placeholder="Not connected" disabled/>
			<button id="send">Send</button>
		</div>
		<div id="messages">
			<p>Connecting...</p>
		</div>
	</body>
</html>
