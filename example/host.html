<!DOCTYPE html>
<html>
	<head>
		<!-- HTML boilerplate -->
		<meta charset="utf8"/>
		<title>Host (WebRTC via QR example)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
		<link rel="stylesheet" href="./style.css"/>
		<!-- Example script -->
		<script type="module">
			import { HostConnection } from "../"	// from "webrtc-via-qr"
			import QRCode from "https://esm.run/qrcode@1.5.3"
			import jsQR from "https://esm.run/jsqr@1.4.0"

			// Config
			const CAMERA_CONSTRAINTS = {
				video: {
					facingMode: "environment",
					frameRate: {
						min: 10,
						max: 60
					},
					aspectRatio: 1
				}
			}

			const CONNECTION_CONFIG = {
				iceServers: [
					{urls:"stun:stun.l.google.com:19302"}
				]
			}

			// Helper shortcuts
			function isFirefox() {
				return navigator.userAgent.includes("Firefox")
			}

			function appendMessage(msg) {
				let p = document.createElement("p")
				p.textContent = msg
				messages.appendChild(p)
			}

			// Create connection
			let h = new HostConnection(CONNECTION_CONFIG)
			let sendChannel = h.createDataChannel("fromhost")
			let receiveChannel

			// Setup listeners
			h.addEventListener("datachannel", e => {
				// Connection successful: Channel established
				receiveChannel = e.channel
				receiveChannel.addEventListener("message", e => {
					let msg = JSON.parse(e.data)
					appendMessage(`${msg.user}: ${msg.text}`)
				})
				// Enable Messaging
				dialog.close()
				chat.setAttribute("placeholder", "Enter message")
				chat.removeAttribute("disabled")
				appendMessage(`Connected successfuly @ ${Date.now()}`)
				// Add ability to send messages
				send.addEventListener("click", () => {
					appendMessage(`Me: ${chat.value}`)
					sendChannel.send(JSON.stringify({
						user: "Host",
						text: chat.value
					}))
					chat.value = ""
				})
			})

			// Buttons
			inviteButton.addEventListener("click", () => {
				h.createInvite()
					.then(invite => {
						dialog.showModal()
						qr.getContext("2d", {willReadFrequently: true})	// Set context attribute *before* first draw (required later in scan)
						QRCode.toCanvas(qr, "http://192.168.0.154:5173/example/join.html?invite=" + invite)
					})
			})

			scanButton.addEventListener("click", () => {
				h2.textContent = "Scan accept code"
				scanButton.setAttribute("disabled", true)
				startScanning()
			})

			closeButton.addEventListener("click", () => {
				stopScanning()
				dialog.close()
			})
			
			// Scanning
			function stopScanning() {}	// Doesn't need to do anything if not scanning yet

			function startScanning() {
				const video = document.createElement("video")
				const ctx = qr.getContext("2d", {
					willReadFrequently: true
				})
				
				function tick() {
					// Only scan if new video frame available
					if (video.readyState == video.HAVE_ENOUGH_DATA) {
						// Draw frame to canvas
						ctx.drawImage(video, 0, 0, qr.width, qr.height)
						// Scan frame for QR
						const pixels = ctx.getImageData(0, 0, qr.width, qr.height)
						const code = jsQR(pixels.data, pixels.width, pixels.height, {inversionAttempts: "dontInvert"})
						if (code) {
							h.confirmAccept(code.data)
							stopScanning()
						}
					}
					// Keep looping
					if (!video.paused) {
						video.requestVideoFrameCallback(tick)
					}
				}

				// Setup camera stream
				window.navigator.mediaDevices.getUserMedia(CAMERA_CONSTRAINTS)
					.then(stream => {
						video.srcObject = stream
						video.play()
						// Implement stopping
						stopScanning = function() {
							video.pause()
							stream.getTracks().forEach(track => track.stop())
						}
						// Start scan-loop
						// HACK: requestVideoFrameCallback isn't implemented in Firefox
						if (isFirefox()) {
							video.requestVideoFrameCallback = function(tick) {
								window.requestAnimationFrame(tick)
							}
						}
						// HACK END
						video.requestVideoFrameCallback(tick)
					})
			}
		</script>
	</head>
	<body>
		<dialog id="dialog">
			<h2 id="h2">Scanned by joinee</h2>
			<canvas id="qr"></canvas>
			<button id="scanButton">Scan accept</button>
			<button id="closeButton">Close</button>
		</dialog>
		<h1>Host</h1>
		<button id="inviteButton">Create invite</button>
		<div>
			<input type="text" id="chat" placeholder="Not connected" disabled/>
			<button id="send">Send</button>
		</div>
		<div id="messages">
			<p>Connecting...</p>
		</div>
	</body>
</html>
