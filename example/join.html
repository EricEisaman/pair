<!DOCTYPE html>
<html>
	<head>
		<!-- HTML boilerplate -->
		<meta charset="utf8"/>
		<title>Join (WebRTC via QR example)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
		<link rel="stylesheet" href="./style.css"/>
		<!-- Example script -->
		<script type="module">
			import { UserConnection } from "https://esm.run/webrtc-via-qr@0.0.1"
			import QRCode from "https://esm.run/qrcode@1.5.3"

			// Config
			const CONNECTION_CONFIG = {
				iceServers: [
					{urls:"stun:stun.l.google.com:19302"}
				]
			}

			// Helper shortcut
			function appendMessage(msg) {
				let p = document.createElement("p")
				p.textContent = msg
				messages.appendChild(p)
			}

			// Assume this page was opened from QR code (= has URL param "invite")
			let params = new URLSearchParams(window.location.search)
			let inviteCode = params.get("invite")
			if (typeof inviteCode === "string" && inviteCode.length > 0) {
				// Create connection
				let u = new UserConnection(CONNECTION_CONFIG)
				let sendChannel = u.createDataChannel("fromuser")
				let receiveChannel
	
				// Setup listeners
				u.addEventListener("connectionstatechange", e => {
					switch (u.connectionState) {
						case "connecting":
							appendMessage("Connecting...")
							break
						case "disconnected":
						case "failed":
							dialog.close()
							appendMessage("Connection failed.")
							break
					}
				})

				u.addEventListener("datachannel", e => {	// Step 4
					// Connection successful: Channel established
					receiveChannel = e.channel
					receiveChannel.addEventListener("message", e => {
						let msg = JSON.parse(e.data)
						appendMessage(`${msg.user}: ${msg.text}`)
					})
					// Enable controls
					dialog.close()
					chat.setAttribute("placeholder", "Enter message")
					chat.removeAttribute("disabled")
					appendMessage(`Connected successfuly @ ${Date.now()}`)
					// Add ability to send messages
					send.addEventListener("click", () => {
						appendMessage(`Me: ${chat.value}`)
						sendChannel.send(JSON.stringify({
							user: "Joinee",
							text: chat.value
						}))
						chat.value = ""
					})
				})
	
				// Respond to invite
				u.acceptInvite(inviteCode)	// Step 2
					.then(accept => QRCode.toCanvas(qr, accept))
			} else {
				dialog.close()
				appendMessage("Connection failed: Param 'invite' was not included in URL (open this page from QR code!)")
			}
		</script>
		<style>
			
		</style>
	</head>
	<body>
		<dialog id="dialog" open>
			<h2>Scanned by host</h2>
			<canvas id="qr"/>
		</dialog>
		<h1>Join</h1>
		<div>
			<input type="text" id="chat" placeholder="Not connected" disabled/>
			<button id="send">Send</button>
		</div>
		<div id="messages"></div>
	</body>
</html>
